name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 4:00 AM UTC every day to refresh stats and art
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            card:
              lines:
                - { type: header, text: 'Aman Raj' }
                - { type: kv, key: Role, value: 'Software Developer | Backend Engineer' }
                - { type: kv, key: Origin, value: 'Patna, Bihar, India' }
                - { type: kv, key: Education, value: 'BCA Student @ AKU & Cimage (Grad: 2028)' }
                - { type: kv, key: Status, value: 'Building HealthCurve AI & Cross-Device Agents' }
                - { type: blank }
                - { type: section, title: 'Toolchain & Stack' }
                - { type: kv, key: Core Lang, value: 'Python, Go, C, C++' }
                - { type: kv, key: Backend, value: 'Flask, FastAPI, SQLite' }
                - { type: kv, key: AI & Vision, value: 'LangChain, TensorFlow, OpenCV' }
                - { type: blank }
                - { type: section, title: 'Live GitHub Stats' }
                - { type: kv, key: Top Languages, value: '{topLanguages}' }
                - { type: kv, key: Contributions, value: '{contributions}' }
                - { type: kv, key: Stars, value: '{stars}' }
                - { type: kv, key: Followers, value: '{followers}' }
