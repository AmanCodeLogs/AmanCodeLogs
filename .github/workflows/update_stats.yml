name: Update GitHub Stats Card

on:
  schedule:
    # Runs automatically at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run generation script
        # The GITHUB_TOKEN is automatically provided by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_card.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dark_mode.svg
          git commit -m "auto-update: github stats card" || exit 0
          git push
